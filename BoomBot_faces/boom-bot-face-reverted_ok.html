<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boom Bot Face</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0e8;
            margin: 0;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 400px;
            height: 400px;
        }
        
        .face {
            position: absolute;
            width: 300px;
            height: 320px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        /* True six-sided shape with longer bottom */
        .hexagon-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            /* Six points for a true hexagon, with longer bottom side */
            clip-path: polygon(20% 0%, 80% 0%, 100% 50%, 70% 100%, 30% 100%, 0% 50%);
            background-color: #ffffff;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.3);
        }
        
        .hexagon-orange {
            position: absolute;
            width: 94%;
            height: 94%;
            top: 3%;
            left: 3%;
            clip-path: polygon(20% 0%, 80% 0%, 100% 50%, 70% 100%, 30% 100%, 0% 50%);
            background-color: #ffa500;
        }
        
        .hexagon-brown {
            position: absolute;
            width: 88%;
            height: 88%;
            top: 6%;
            left: 6%;
            clip-path: polygon(20% 0%, 80% 0%, 100% 50%, 70% 100%, 30% 100%, 0% 50%);
            background-color: #553322;
        }
        
        .hexagon-gray {
            position: absolute;
            width: 82%;
            height: 82%;
            top: 9%;
            left: 9%;
            clip-path: polygon(20% 0%, 80% 0%, 100% 50%, 70% 100%, 30% 100%, 0% 50%);
            background-color: #999999;
        }
        
        .hexagon-yellow {
            position: absolute;
            width: 76%;
            height: 76%;
            top: 12%;
            left: 12%;
            clip-path: polygon(20% 0%, 80% 0%, 100% 50%, 70% 100%, 30% 100%, 0% 50%);
            background-color: #ffff00;
        }
        
        .eye {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #553322;
            top: 32%;
        }
        
        .eye-left {
            left: 30%;
        }
        
        .eye-right {
            right: 30%;
        }
        
        .mouth {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 30px;
        }
        
        .mouth-w {
            stroke: #553322;
            stroke-width: 5;
            fill: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="face">
            <div class="hexagon-outer"></div>
            <div class="hexagon-orange"></div>
            <div class="hexagon-brown"></div>
            <div class="hexagon-gray"></div>
            <div class="hexagon-yellow"></div>
            <div class="eye eye-left"></div>
            <div class="eye eye-right"></div>
            <svg class="mouth" viewBox="0 0 100 30">
                <path class="mouth-w" d="M10,10 L30,20 L50,10 L70,20 L90,10" />
            </svg>
        </div>
    </div>

    <script>
        const moods = [
            {
                eyes: "border-radius: 50%;",
                mouth: "M10,10 L30,20 L50,10 L70,20 L90,10"
            },
            {
                eyes: "border-radius: 50%;",
                mouth: "M10,15 L90,15"
            },
            {
                eyes: "border-radius: 50%;",
                mouth: "M10,20 L30,10 L50,20 L70,10 L90,20"
            },
            {
                eyes: "border-radius: 50%; transform: rotate(45deg);",
                mouth: "M20,20 L80,20"
            },
            {
                eyes: "border-radius: 50%; height: 5px;",
                mouth: "M10,5 Q50,40 90,5"
            }
        ];

        let currentMoodIndex = 0;
        const eyeLeft = document.querySelector('.eye-left');
        const eyeRight = document.querySelector('.eye-right');
        const mouthPath = document.querySelector('.mouth-w');

        function changeMood() {
            const mood = moods[currentMoodIndex];
            
            // Update eyes
            eyeLeft.style.cssText = mood.eyes;
            eyeRight.style.cssText = mood.eyes;
            
            // Update mouth
            mouthPath.setAttribute('d', mood.mouth);
            
            // Move to next mood
            currentMoodIndex = (currentMoodIndex + 1) % moods.length;
        }

        // Change mood every 5 seconds
        setInterval(changeMood, 5000);
        
        // Set initial mood
        changeMood();
    </script>
</body>
</html>
